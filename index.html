<!DOCTYPE html>
<html>
<head>
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Sorting Visualizer</h2>

<input id="input" placeholder="Enter numbers (5,3,8,1)">
<button onclick="setArray()">Set Array</button>
<button onclick="randomArray()">Random</button>

<br>

<button onclick="start('bubble')">Bubble Sort</button>
<button onclick="start('selection')">Selection Sort</button>
<button onclick="start('insertion')">Insertion Sort</button>

<br>

<button onclick="prev()">⏮️ Prev</button>
<button onclick="next()">⏭️ Next</button>

<div id="array"></div>
<div id="explanation"></div>

<script src="script.js"></script>

</body>
</html>
